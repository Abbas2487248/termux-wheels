# Compile ast-serialize en wheel pour Termux (armv7l / arm 32 bits, Python du dépôt Termux)
# Se lance tout seul quand ce fichier change, ou à la main :
#   onglet "Actions" > "Wheel Termux armv7" > "Run workflow"

name: Wheel Termux armv7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-termux-armv7.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de ast-serialize (laisser vide = dernière version)"
        required: false
        default: ""

permissions:
  contents: write   # pour publier la wheel dans une Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # la compilation Rust sous émulation ARM est lente

    steps:
      - name: Activer l'émulation ARM 32 bits (QEMU)
        run: docker run --rm --privileged aptman/qus -s -- -p arm

      - name: Limiter pid_max (problème connu des conteneurs 32 bits)
        run: sudo sysctl -w kernel.pid_max=65535

      - name: Préparer le script de compilation
        env:
          PKG_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p work/wheelhouse
          if [ -n "$PKG_VERSION" ]; then
            echo "ast-serialize==$PKG_VERSION" > work/spec.txt
          else
            echo "ast-serialize" > work/spec.txt
          fi
          cat > work/build.sh <<'EOF'
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          export PIP_BREAK_SYSTEM_PACKAGES=1
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          W="$HOME/work"

          # Même dépôt Termux que sur le téléphone -> même Python 3.14
          apt-get update
          apt-get -y -o Dpkg::Options::=--force-confnew full-upgrade
          apt-get -y install python python-pip rust binutils

          uname -m
          python --version
          rustc --version

          # Moins de mémoire et de temps pour rustc (adressage 32 bits sous QEMU)
          export CARGO_BUILD_JOBS=2
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_DEBUG=0

          # Le paquet Termux "maturin" fournit la commande (pas le module Python
          # que pip attend) : on appelle donc maturin directement sur les sources.
          apt-get -y install maturin
          maturin --version
          python -c "import sys, sysconfig; print(sys.platform, sysconfig.get_platform())"

          SPEC="$(cat "$W/spec.txt")"
          rm -rf "$HOME/src" && mkdir -p "$HOME/src"
          pip download --no-deps --no-binary :all: -d "$HOME/src" "$SPEC"
          tar -xzf "$HOME"/src/*.tar.gz -C "$HOME/src"
          cd "$(ls -d "$HOME"/src/*/ | head -n 1)"
          maturin build --release --interpreter python --out "$W/wheelhouse"
          cd "$HOME"
          ls -l "$W/wheelhouse"

          # Vérifie que la wheel s'installe dans Termux ; sinon on corrige l'étiquette
          # de plateforme pour qu'elle corresponde à ce que le pip de Termux accepte.
          if ! pip install --no-index --find-links "$W/wheelhouse" ast-serialize; then
            PLAT=$(python -c "import sysconfig; print(sysconfig.get_platform().replace('-', '_').replace('.', '_'))")
            echo "Ré-étiquetage de la wheel pour la plateforme $PLAT"
            pip install wheel
            python -m wheel tags --remove --platform-tag "$PLAT" "$W"/wheelhouse/*.whl
            ls -l "$W/wheelhouse"
            pip install --no-index --find-links "$W/wheelhouse" ast-serialize
          fi
          pip show ast-serialize
          python -c "import ast_serialize; print('import OK', ast_serialize.__file__)" \
            || echo "AVERTISSEMENT: import ast_serialize impossible"
          ls -l "$W/wheelhouse"
          EOF
          chmod -R 777 work

      - name: Compiler dans un vrai environnement Termux arm
        run: |
          set -o pipefail
          docker run --rm --privileged \
            -v "$PWD/work:/data/data/com.termux/files/home/work" \
            termux/termux-docker:arm \
            bash /data/data/com.termux/files/home/work/build.sh 2>&1 | tee build.log

      - name: Résumé de l'erreur
        if: failure()
        run: |
          tail -n 60 build.log > tail.log || true
          msg=$(sed -e 's/%/%25/g' tail.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=Echec de compilation::${msg}"

      - name: Publier la wheel (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: ast-serialize-termux-armv7
          path: work/wheelhouse/*.whl
          if-no-files-found: error

      - name: Publier la wheel (Release GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHL=$(ls work/wheelhouse/*.whl | head -n 1)
          NAME=$(basename "$WHL")
          VER=$(echo "$NAME" | cut -d- -f2)
          TAG="ast-serialize-${VER}-termux-armv7"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          gh release delete "$TAG" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          printf 'Wheel compilée dans Termux (arm, armv7l).\n\nInstallation dans Termux :\n\n```\npip install %s\n```\n' "$URL" > notes.md
          gh release create "$TAG" "$WHL" -R "$GITHUB_REPOSITORY" \
            --title "ast-serialize ${VER} — Termux armv7" --notes-file notes.md
          echo "Wheel : $URL" >> "$GITHUB_STEP_SUMMARY"
